# push · PR마다 화면 테스트와 규칙 · 저장 테스트를 돌린다.
# 공휴일 표(src-tauri/data/holidays.json)만 고쳐 push해도 cargo test가 표를 검사하므로,
# 잘못된 표가 설치된 PC로 내려가기 전에 여기서 걸린다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Rust 쪽에 Windows 전용 코드(드라이브 종류, WebView2)가 있어 Windows에서 돌린다.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 패키지 설치
        run: npm ci

      # tauri::generate_context!가 dist 폴더를 요구하므로 cargo test 전에 화면을 먼저 빌드한다 (tsc 포함)
      - name: 화면 빌드 · 타입 검사
        run: npm run build

      - name: 화면 코드 검사
        run: npm run lint

      - name: 화면 테스트
        run: npm test

      # 새 Rust 버전의 새 경고로 CI가 갑자기 깨지지 않도록 버전을 고정한다 (올릴 때 여기 숫자를 바꾼다)
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Rust 코드 모양 검사
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust 코드 검사 (경고도 실패로)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 규칙 · 저장 테스트
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 같은 라이브러리가 여러 버전으로 들어오면 앱이 커진다. 실패로 막지는 않고 기록만 남긴다
      # (Tauri 자체가 windows-sys 여러 버전을 쓰므로 0개로 만들 수는 없다).
      - name: 중복 의존성 기록
        run: cargo tree --manifest-path src-tauri/Cargo.toml -d -e normal --depth 0
